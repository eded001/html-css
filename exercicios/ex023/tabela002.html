<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot {
            background-color: #383838;
            color: white;
        }

        tbody > tr:nth-child(even) { /* :nth-of-type() = corresponde a um ou mais elementos de um dado tipo, baseado na posição de seus irmãos, de modo que representa o padrão para corresponder os elementos | odd = ímpar (2n-1), even = par (2n) */
            background-color: lightgray;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }

        .num {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>

    <!--
        anatomias para tabelas grandes
        TABLE = tag de abertura
            CAPTION (legenda da tabela)
            THEAD (cabeça)
                tr(linha), td(dado), th(cabeçalho)
            TBODY (corpo)
                tr, td, th
            TFOOT (pé)
                tr, td, th
        TABLE = tag de desfecho
    -->

    <table> <!-- tabela -->
        <caption> <!-- legenda da tabela-->
            População das Unidades Federativas
        </caption>
        <thead> <!-- tabela-cabeça -->
            <tr> <!-- tabela-linha -->
                <th scope="col">Estado</th> <!-- tabela-cabeçalho | scope = define as células a que o cabeçalho se relaciona | col = se relaciona com todas as células da coluna a que pertence  -->
                <th scope="col" style="width: 50px;">População</th> <!-- tabela-cabeçalho -->
            </tr>
        </thead>
        <tbody> <!-- tabela-corpo -->
            <tr> <!-- tabela-linha -->
                <td>São Paulo</td> <!-- tabela-dado -->
                <td class="numero">45.919.049</td> <!-- tabela-dado -->
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="numero">21.168.049</td>
            </tr>
            <tr>
                <td>Rio Janeiro</td>
                <td class="numero">17.264.943</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="numero">14.873.064</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="numero">11.433.957</td>
            </tr>
        </tbody>
        <tfoot> <!-- tabela-pé -->
            <tr> <!-- tabela-linha -->
                <th scope="row">Total de habitantes</th> <!-- tabela-cabeçalho | row = se relaciona com todas as células da linha a que pertence -->
                <td><strong>110.659.062</strong></td> <!-- tabela-dado -->
            </tr>
        </tfoot>
    </table>
</body>
</html>
