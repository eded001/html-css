<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }

        thead, th {
            border-collapse: collapse;

            border: 1px solid black;

            background-color: gray;

            padding: 5px;

            font-weight: bold;

            color: white;
        }

        td {
            border-collapse: collapse;

            border: 1px solid black;

            padding: 5px;

            font-weight: bold;
        }

        .media {
            background-color: gray;

            color: white;
        }
    </style>
</head>
<body>
    <!--
        anatomias para tabelas grandes
        TABLE (tag de abertura)
            CAPTION (legenda da tabela)
            THEAD (cabeça)
                tr(linha), td(dado), th(cabeçalho)
            TBODY (corpo)
                tr(linha), td(dado), th(cabeçalho)
            TFOOT (pé)
                tr(linha), td(dado), th(cabeçalho)
        TABLE (tag de desfecho)

        colspan = preenche linha

        rowspan = preenche uma coluna
    -->
    <table> <!-- tabela - tag de abertura -->
        <thead> <!-- cabeça - tag de abertura  -->
            <tr> <!-- linha -->
                <th rowspan="2" scope="col">Área</th> <!-- cabeçalho -->
                <th rowspan="2" scope="col">Disciplina</th> <!-- cabeçalho -->
                <th colspan="2" scope="colgroup">Notas</th> <!-- cabeçalho -->
                <th rowspan="2" scope="col">Média</th> <!-- cabeçalho -->
            </tr>
            <tr>
                <td>Nota 1</td>
                <td>Nota 2</td>
            </tr>
        </thead> <!-- cabeça - tag de fechamento -->
        <tbody> <!-- corpo - tag de abertura -->
            <tr>
                <td rowspan="4">Exatas</td>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td colspan="4" class="media">Média de Exatas</td>
                <td class="media">0.0</td>
            </tr>
            <tr>
                <td rowspan="3">Humanas</td>
            </tr>
            <tr>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td colspan="4" class="media">Média Humanas</td>
                <td class="media">0.0</td>
            </tr>
        </tbody> <!-- corpo - tag de fechamento -->
    </table> <!-- tabela - tag de fechamento -->
</body>
</html>
