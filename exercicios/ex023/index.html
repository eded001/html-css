<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse; /* border-collapse = define se as células terão bordas compartilhadas ou separadas | o valor pode ser collapse ou separate (padrão) */
            border: 1px solid black;
        }

        .linha {
            background-color: gray;
        }

        td {
            border-top-left-radius: 1px solid black;
            padding: 10px;
        }

        .dado {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
        hierarquia de tabelas (simples):
        table = tabela
            table row (tr) = linha da tabela 
                table header (th) = cabeçalho da tabela
                table data (td)= dado da tabela

        é importantíssimo seguir essa hierarquia!!
    -->
    <table>
        <tr> <!-- primeira linha -->
            <td class="dado">A1</td>
            <td >B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha"> <!-- segunda linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!-- terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!-- quarta linha -->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
