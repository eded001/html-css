<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            height: 400px;
            width: 400px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!--
        hierarquia da tabela
            TABLE (tag de abertura)
                TR (linha)
                    TD (dado)
                TR (linha)
            TABLE (tag de desfecho)
    -->
    <table>
        <tr> <!-- linha -->
            <td colspan="4">A</td> <!-- dado | colspan = preenche linha -->
            <td rowspan="4">B</td>
        </tr>
        <tr>
            <td rowspan="4">C</td> <!-- rowspan = preenche coluna -->
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
        <tr>
            <td colspan="4">N</td>
        </tr>
    </table>
</body>
</html>
