<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo-classes</title>
    <style>
        div {
            display: inline-block; /* deixa tudo na mesma linha */
            background-color: lightgray;
            border: 1px solid black; /* largura / tipo / cor */
            text-align: center;
            height: 200px; /* altura */
            width: 200px; /*largura*/
        }

        div:hover { /* pseudo-classe hover | quando passar o mouse por cima */
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="d1">1</div>
    <div id="d2">2</div>
    <div id="d3">3</div>
</body>
</html>
