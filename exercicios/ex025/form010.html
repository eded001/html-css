<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="">
        <p>
            <label for="iano">em que ano você nasceu?</label> <br>
            <input type="number" name="ano" id="iano" min="1915" max="2022" oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">sua idade é:</label>
            <output id="iidade">0</output>
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>

    <script>
        function calcIdade() {
            let ano = new Date().getFullYear()

            iidade.innerHTML = Number(ano) - Number(iano.value)
        }
    </script>
</body>
</html>
