<!DOCTYPE html> <!-- tipo do documento -->
<html lang="pt-br"> <!-- língua -->
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- "viewport": ocupar toda a tela disponível -->
    <title>meu primeiro site eba</title> <!-- título -->
</head>
<body>
    <h1>olá, mundo</h1> <!-- cabeçalho (título - nível 1) -->
    <hr> <!-- linha horizontal -->
    <p>esse é o meu primeiro documento html</p> <!-- parágrafo -->
</body>
</html>
