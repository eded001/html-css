<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
    <style>
        iframe {
            width: 500px;
            height: 500px;

            border-radius: 5px;

            background-color: lightblue;

            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <p>Acessando o site do
        <iframe src="https://cursoemvideo.com" frameborder="0">
            <a href="https://cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe> <!-- incorpora uma "página" dentro do documento | tamanho padrão 300(largura)x150(altura) | pode-se aplicar o "height" e o "width" dentro da tag -->
        para aprender a programar
    </p>
</body>
</html>
