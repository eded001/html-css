<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trabalhando com links</title>
</head>
<style>
    body {
        background-color: darkgray;
    }
</style>
<body>
    <h1>usando links externos</h1> <!-- também chamados de URL's ou âncoras-->
    <p>veja o <a href="https://www.youtube.com/watch?v=VQ7lKPSUc2g" target="_blank" rel="external">Putin rebaixado alargado andando</a></p> <!-- a tag "a" é onde insere o link | o "target" faz com que o link abra uma nova aba | se o "rel" for "nofollow" é porque o site não é confiável -->
    <hr>
    <h1>usando links internos</h1>
    <p>esta é a segunda página do site: <a href="pag002.html">link</a></p>
    <h1>links para download:</h1>
    <ul>
        <li><a href="livro/jojo_manga.pdf" download="jojo_manga.pdf" type="application/pdf">baixar o livro em PDF</a></li> <!-- usar "#" para quando for um link vazio, ou estiver arrumando o arquivo -->
        <li><a href="livro/jojo_manga.zip" download="jojo_manga.zip" type="application/zip">livro compactado em ZIP</a></li> <!-- a tag "download" pede um download | o "type" serve para dizer o tipo de arquivo -->
    </ul>
</body>
</html>
