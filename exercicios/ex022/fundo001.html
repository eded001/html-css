<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagem de fundo</title>
    <style>
        body {
            background-image: url(imagens/wallpaper001.jpg); /* adiciona uma imagem como fundo */
        }

        .quadrado {
            width: 300px; /* largura */
            height: 300px; /* altura */

            border: 1px solid black; /* borda: tamanho estilo cor */
            border-radius: 10px;

            display: inline-block; /* display: bloco na mesma linha */

            background-color: lightgray;
        }

        #q1 {
            background-color: lightblue;
        }

        #q2 {
            background-image: linear-gradient(to bottom, lightblue, purple);
        }

        #q3 {
            background-image: url(imagens/pattern003.png);
        }
    </style>
</head>

<body>
    <!-- contêineres -->
    <div class="quadrado" id="q1"></div>
    <div class="quadrado" id="q2"></div>
    <div class="quadrado" id="q3"></div>
</body>

</html>
