<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid - Parent properties</title>
    <style>
        * {
            padding: 0;
            margin: 0;

            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background-color: slategray;

            font-size: 1.3em;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 0 0 1px black;

            color: white;
        }

        main {
            display: grid;

            grid-template-columns: 3fr 1fr ; /* define o tamanho/quantidade de colunas */

            grid-template-rows: 20vh 70vh 10vh; /* define o tamanho/quantidade de linhas */

            grid-template-areas:
                "header header"
                "article aside"
                "footer footer"
            ; /* da nome às linhas e define um modelo a ser seguido*/
        }

        header {
            background-color: yellow;

            display: flex;
            justify-content: center;
            align-items: center;

            grid-area: header;
        }
        header::after {content: 'header';}

        article {
            background-color: blue;

            display: flex;
            justify-content: center;
            align-items: center;

            grid-area: article;
        }
        article::after {content: 'article';}

        aside {
            background-color: green;

            display: flex;
            justify-content: center;
            align-items: center;

            grid-area: aside;
        }
        aside::after {content: 'aside';}

        footer {
            background-color: red;

            display: flex;
            justify-content: center;
            align-items: center;

            grid-area: footer;
        }
        footer::after {content: 'footer';}
    </style>
</head>
<body>
    <main>
        <header></header>
        <article></article>
        <aside></aside>
        <footer></footer>
    </main>
</body>
</html>
