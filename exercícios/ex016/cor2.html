<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gradiente em css</title>
    <style>
        * { /** configuração global das CSS**/
            height: 100%;
        }
        body {
            background-image: linear-gradient(to left, #D7151D , #E21D24, #BD1721, #3A0C0F); /** "background-image" para usar o "linear gradient", para usar duas cores. pode-se usar direção ou grau | top, bottom, left, right | NÃO DEIXAR ESPAÇO!!!!! **/
            /** tem os radial e linear. o radial faz curva e o linear segue uma única direção **/
            background-attachment: fixed; /** fixa o a imagem de fundo quando abaixa **/
        }
        h1 {
            color: #0D0707;
        }
    </style>
</head>
<body>
    <h1>testando gradiente</h1>
</body>
</html>
