<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fontes externas</title>
    <style>
        @font-face {
            font-family: 'sweetie';
            src: url('fontes/Sweetie Summer.ttf') format('opentype');
            font-weight: normal; /* peso/intensidade */
            font-style: normal;
            /* 
            tipos de format()
            opentype (otf)
            truetype (ttf)
            embedded-opentype
            truetype-aat (Apple Advanced Typography)
            svg
            */ 
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'sweetie', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>olá mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste fuga molestiae deserunt. Optio, repudiandae sequi. Totam beatae incidunt dolore ab dolores inventore tempore! Corrupti aut laboriosam blanditiis praesentium consectetur nam.</p>
</body>
</html>
