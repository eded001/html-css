<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste com imagens</title>
</head>
<body>
    <h1>testando carga e imagens</h1>
    <p>abaixo você vai ver uma imagem que está na mesma pasta</p>
    <p>imagem abaixo: "html5200.png"</p>
    <img src="html5200.png" alt="logo HTML5"> <!-- a tag "img": abre uma imagem dentro da pasta | "src": o nome do arquivo -->
    <hr>
    <p>imagem abaixo: "css3200.png"</p>
    <img src="css3200.png" alt="logo css"> <!--- atalho para abrir imagens: Ctrl + space -->
    <hr>
    <p>também posso colocar imagens de subpastas</p>
    <img src="imagens/javascript200.png" alt="logo JavasCript"> <!-- a tag seleciona imagens de pastas, por isso o "imagens/(nome do arquivo)" -->
    <hr>
    <p>e também posso colocar endereços da internet (um URL)</p>
    <img src="https://code.visualstudio.com/assets/apple-touch-icon.png" alt="logo visual studio code"> <!-- URL -->
</body>
</html>
