<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-image: linear-gradient(-45deg, rgb(0, 128, 128),rgb(0, 120, 128),rgb(0, 101, 128),rgb(0, 83, 128),rgb(0, 70, 128),rgb(0, 61, 138),rgb(0, 50, 128), rgb(0, 40, 128));
            background-size: 300% 300%;

            animation: gradient 20s ease infinite;

            height: 100vh;
        }

        @keyframes gradient {
            0% {background-position: 0 50%;}

            50% {background-position: 100% 50%}

            100% {background-position: 0 50%;}
        }
    </style>
</head>
<body>
</body>
</html>
